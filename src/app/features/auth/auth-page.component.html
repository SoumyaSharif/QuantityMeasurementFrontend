<div class="bg-scene">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="brand-panel">
      <div class="brand-icon">
        <svg viewBox="0 0 80 100" xmlns="http://www.w3.org/2000/svg" width="80">
          <rect x="20" y="5" width="40" height="65" rx="6" fill="#5b8af5" opacity="0.9" />
          <rect x="25" y="55" width="30" height="15" rx="3" fill="#7ba3ff" />
          <rect x="25" y="35" width="30" height="12" rx="3" fill="#a8c0ff" opacity="0.7" />
          <rect x="10" y="70" width="60" height="12" rx="4" fill="#e2a96a" />
          <rect x="15" y="72" width="8" height="8" rx="1" fill="#c47d3a" />
          <rect x="27" y="72" width="8" height="8" rx="1" fill="#c47d3a" />
          <rect x="39" y="72" width="8" height="8" rx="1" fill="#c47d3a" />
          <rect x="51" y="72" width="8" height="8" rx="1" fill="#c47d3a" />
          <rect x="63" y="72" width="8" height="8" rx="1" fill="#c47d3a" />
        </svg>
      </div>

      <h1 class="brand-name">
<span class="brand-name-top">UNIT</span>
<span class="brand-name-bottom">FACTORY</span>
      </h1>

      <p class="brand-tagline">Measure, Convert &amp; Compare</p>

      <div class="brand-features">
        <div class="brand-feature"><span class="feat-dot"></span>Length &amp; Weight</div>
        <div class="brand-feature"><span class="feat-dot"></span>Temperature</div>
        <div class="brand-feature"><span class="feat-dot"></span>Volume</div>
      </div>
    </div>

    <div class="form-panel">
      <div class="tabs">
        <button class="tab" [class.active]="activeTab === 'login'" type="button" (click)="switchTab('login')">LOGIN</button>
        <button class="tab" [class.active]="activeTab === 'signup'" type="button" (click)="switchTab('signup')">SIGNUP</button>
      </div>

      <div class="form-section" [class.active-form]="activeTab === 'login'" [class.hidden-form]="activeTab !== 'login'">
        <div class="field">
          <label>Email Id</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="Enter your email"
            [(ngModel)]="loginForm.email"
            [class.error]="isInvalid('loginEmail')"
            (input)="clearFieldError('loginEmail')"
          />
        </div>

        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input
              id="loginPassword"
              [type]="showLoginPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              [(ngModel)]="loginForm.password"
              [class.error]="isInvalid('loginPassword')"
              (input)="clearFieldError('loginPassword')"
            />
            <button class="eye-btn" type="button" (click)="togglePassword('login')" [innerHTML]="eyeIcon(showLoginPassword)"></button>
          </div>
        </div>

        <div class="error-msg" [class.hidden]="!loginError">{{ loginError }}</div>
        <button class="btn-primary" type="button" (click)="doLogin()">Login</button>
        <p class="switch-link">Don't have an account? <a (click)="switchTab('signup')">Sign Up</a></p>
      </div>

      <div class="form-section" [class.active-form]="activeTab === 'signup'" [class.hidden-form]="activeTab !== 'signup'">
        <div class="field">
          <label>Full Name</label>
          <input
            id="signupName"
            type="text"
            placeholder="Enter your full name"
            [(ngModel)]="signupForm.name"
            [class.error]="isInvalid('signupName')"
            (input)="clearFieldError('signupName')"
          />
        </div>

        <div class="field">
          <label>Email Id</label>
          <input
            id="signupEmail"
            type="email"
            placeholder="Enter your email"
            [(ngModel)]="signupForm.email"
            [class.error]="isInvalid('signupEmail')"
            (input)="clearFieldError('signupEmail')"
          />
        </div>

        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input
              id="signupPassword"
              [type]="showSignupPassword ? 'text' : 'password'"
              placeholder="Create a password"
              [(ngModel)]="signupForm.password"
              [class.error]="isInvalid('signupPassword')"
              (input)="clearFieldError('signupPassword')"
            />
            <button class="eye-btn" type="button" (click)="togglePassword('signup')" [innerHTML]="eyeIcon(showSignupPassword)"></button>
          </div>
          <span class="hint-msg" [class.hidden]="!validateSignupPassword()">Min 6 characters.</span>
        </div>

        <div class="field">
          <label>Mobile Number</label>
          <input
            id="signupMobile"
            type="tel"
            maxlength="10"
            placeholder="Enter mobile number"
            [(ngModel)]="signupForm.mobile"
            [class.error]="isInvalid('signupMobile')"
            (input)="clearFieldError('signupMobile')"
          />
          <span class="hint-msg" [class.hidden]="!validateMobile()">Enter valid 10-digit number.</span>
        </div>

        <div class="error-msg" [class.hidden]="!signupError">{{ signupError }}</div>
        <button class="btn-primary" type="button" (click)="doSignup()">Create Account</button>
        <p class="switch-link">Already have an account? <a (click)="switchTab('login')">Login</a></p>
      </div>
    </div>
  </div>
</div>
